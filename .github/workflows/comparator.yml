name: Comparator

# Machine-checked STATEMENT-level trust, independent of this repo's own build.
#
# The repo's own `lake build` + per-headline `#print axioms` (recorded in STATUS.md) certify the
# *proofs* — but they run inside our own Lean environment, so they trust our elaborator, our
# oleans, and any macro/tactic/set_option in the project.
#
# comparator certifies the *statements*, from outside:
#   1. Each Comparator/<Result>/Challenge.lean imports ONLY Mathlib and states the headlines with
#      `sorry`. That file is the entire human audit surface.
#   2. Solution.lean discharges them from the real development.
#   3. comparator exports both environments (it deliberately does NOT load our oleans), checks that
#      every declaration used in a challenge statement is IDENTICAL in the solution, replays the
#      proofs through the Lean kernel AND the independent `nanoda` kernel, and enforces the
#      permitted-axiom whitelist.
#
# The solution build runs under `landrun` (Linux Landlock sandbox), so a solution that tried to
# rewrite the challenge's oleans mid-elaboration could not. That protects a *stranger* checking this
# repo without trusting us -- which is the point: it is what makes the result independently checkable.
#
# Linux-only by construction (landrun needs Landlock). There is no local/macOS path, and that is
# fine: this is an external-verifiability gate, not a dev loop. Local pre-flight of the
# statement-identity part: scripts/comparator-probe.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-26.04
    env:
      # lean4export MUST match the Lean version of THIS project's oleans, or it refuses them with
      # "incompatible header". Keep in lockstep with lean-toolchain. The build step below also
      # overwrites its lean-toolchain with THIS repo's, so the binary is built on our exact
      # toolchain; the cache key hashes our lean-toolchain, so a toolchain bump rotates the cache
      # even when this tag does not change.
      LEAN4EXPORT_TAG: v4.31.0
      # The other three verifier components ship no usable release tags, so they are pinned by SHA.
      # Every pin is in the cache key: once, in lean-gallery, unpinned clones + a pin-free cache key
      # meant the whole verifier-build step was silently SKIPPED for weeks, replaying binaries
      # frozen at whatever `main` was the day the key was first populated — and the eventual forced
      # rebuild picked up a landrun cli-v3 migration that broke comparator's lean4export invocation.
      # Bump these deliberately, and expect to re-verify when you do.
      LANDRUN_REV: 5e9a0d15d6009cdaf27133bf2d59d29e7018cc47
      NANODA_REV: f58f2f6d535e189a40fcb02ede8eb95f97a92d37
      COMPARATOR_REV: 68a064109f01c08f47c8edc9f51d6a2bbffaa188
    steps:
      - uses: actions/checkout@v7

      # elan/lake MUST come first: the verifier build below compiles lean4export and comparator,
      # which are Lean projects. (They are on their own toolchains -- elan fetches whatever each
      # one's lean-toolchain pins, independently of ours.) `build: false` because we drive the
      # project's own build explicitly further down.
      - uses: leanprover/lean-action@v1
        with:
          build: false

      # --- the four external binaries comparator needs --------------------------------------
      # Cached together: none of them depend on this repo, so the key is just the pinned versions.
      - name: Cache verifier binaries
        id: cache-bins
        uses: actions/cache@v6
        with:
          path: ~/verifier-bin
          # Every pinned rev is in the key: bumping any pin rotates the cache and the rebuild
          # below actually runs, instead of the pin being a comment that changes nothing.
          key: verifier-bin-${{ runner.os }}-${{ env.LEAN4EXPORT_TAG }}-${{ hashFiles('lean-toolchain') }}-${{ env.LANDRUN_REV }}-${{ env.NANODA_REV }}-${{ env.COMPARATOR_REV }}

      - name: Build landrun, lean4export, nanoda, comparator
        if: steps.cache-bins.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/verifier-bin ~/verifier-src && cd ~/verifier-src

          # landrun -- Landlock sandbox. Pinned to the last commit on urfave/cli v2; the v3
          # migration consumes the bare `--` terminator comparator relies on.
          git clone https://github.com/Zouuup/landrun.git
          (cd landrun && git checkout "$LANDRUN_REV" && go build -o ~/verifier-bin/landrun ./cmd/landrun)

          # nanoda -- the INDEPENDENT kernel. This is the one component that buys real mathematical
          # assurance: with it, the trust assumption weakens from "the Lean kernel is correct" to
          # "the Lean kernel OR nanoda is correct".
          git clone https://github.com/ammkrn/nanoda_lib.git
          (cd nanoda_lib && git checkout "$NANODA_REV" && cargo build --release \
             && cp target/release/nanoda_bin ~/verifier-bin/)

          # lean4export -- sources from the matching tag, BUILT ON OUR TOOLCHAIN (see the
          # LEAN4EXPORT_TAG note above): the toolchain overwrite is what makes its binary accept
          # this repo's oleans even when our patch version has no lean4export tag of its own.
          git clone https://github.com/leanprover/lean4export.git
          (cd lean4export && git checkout "$LEAN4EXPORT_TAG" \
             && cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain && lake build \
             && cp .lake/build/bin/lean4export ~/verifier-bin/)

          # comparator itself (builds on its own toolchain; elan fetches it).
          git clone https://github.com/leanprover/comparator.git
          (cd comparator && git checkout "$COMPARATOR_REV" && lake build comparator \
             && cp .lake/build/bin/comparator ~/verifier-bin/)

      # --- the harness modules (prebuilt Mathlib oleans from the cache) ----------------------
      # Deliberately `lake build Comparator`, NOT the full default target: the Solution's import
      # closure is the transcendence chain only, while the default target also pulls in the
      # PrimeNumberTheoremAnd cluster -- a from-source dependency build the harness never touches.
      - name: Build comparator modules
        run: |
          lake exe cache get
          lake build Comparator

      # --- run every challenge/solution pair -------------------------------------------------
      - name: Verify every result under comparator (Lean kernel + nanoda)
        run: |
          set -uo pipefail
          export PATH="$HOME/verifier-bin:$PATH"
          fail=0
          shopt -s nullglob
          configs=(Comparator/*/config.json)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::no comparator configs found -- the gate would pass vacuously"; exit 1
          fi
          echo "### 🔍 Comparator: statement-level verification" >> "$GITHUB_STEP_SUMMARY"
          for cfg in "${configs[@]}"; do
            name=$(basename "$(dirname "$cfg")")
            echo "::group::comparator — $name"
            if lake env comparator "$cfg"; then
              echo "::notice::comparator OK — $name"
              echo "- ✅ \`$name\` — challenge statements proved, both kernels accept" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::comparator FAILED — $name"
              echo "- ❌ \`$name\` — FAILED" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
